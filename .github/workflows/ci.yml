# Test strategy: docs/decisions/2026-11-27-test-strategy.md
# Commands: docs/tasks/005-github-actions.md
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew :androidApp:assembleDebug :sharedLogic:testAndroidHostTest

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew :sharedLogic:iosSimulatorArm64Test
